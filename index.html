<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title></title>
</head>
<body>
  <h1>
    Register new staff
  </h1>
  <form>
    <label for="Uname">Username:</label>
    <input type="text" id="Uname" name="Username">
    <br>
    <br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br>
    <br>
    <label for="fname">Full name:</label>
    <input type="text" id="fname" name="full name">
    <br>
    <br>
    <label for="Email">Email:</label>
    <input type="Email" id="email" name="email">
    <br>
    <br>
    <label for="tel">Phone number:</label>
    <input type="tel" id="tel" name="tel">
    <br>
    <br>
    <label for="address">Address:</label>
    <input type="address" id="address" name="address">
    <br>
    <br>
    <label for="designation">Designation:</label>
    <select id="designation" name="designation">
    <option value="general manager">General Manager</option>
    <option value="sales executive">Sales Executive</option>
    <option value="secretary">Secretary</option>
    <option value="project surpervisor"selected>Project Supervisor</option>
    <option value="cleaner">Cleaner</option>
    <option value="gate keeper">Gate keeper</option>
    </select>
    
    <label for="others">Others:</label>
    <input type="text" id="other" name="other">
    
    <br>
    <br>
    <label for="department">Department:</label>
    <select id="department" name="department"> 
    <option value="management">Management</option>
      <option value="logistic department">Logistic development</option>
      <option value="procurement department">Procurement department</option>
      <option value="information technology"selected>Information technology</option>
      <option value="security department">Security department</option>
      <option value="operational department">Operational department</option>
      <option value="research department">Research department</option>
      <option value="legal department">Legal departmennt</option>
      <option value="finance">Finance</option>
      <option value="others">Others</option>
    </select>
    <br>
    <br>
    <label for="hotel branch">Hotel branch:</label>
    <select id="hotel branch" name="hotel branch">
      <option value="kuto">Kuto</option>
      <option value="lafenwa">Lafenwa</option>
      <option value="olomoore">Olomoore</option>
      <option value="soyoye">Soyoye</option>
      <option value="panseke">Panseke</option>
      <option value="itoku">Itoku</option>   
    </select>
    <br>
    <br>
    <input type="submit" value="SUBMIT">
    <input type="reset" value="RESET">
  </form>
</body>
</html>
